<script>
/* ===== BORANG SINGAPURA: kad pakej boleh ditekan + ringkasan pesanan + medan pakej + telefon +65 + poskod 6 digit ===== */
(function(){
  var PK={
    "3":{nama:"3 Botol (Rawatan Penuh)",asal:327,diskaun:188,inc:"3 botol (45 hari) + jaminan 100% refund",nilai:"3 Botol - SGD 139"},
    "2":{nama:"2 Botol (Melegakan)",asal:218,diskaun:99,inc:"2 botol (30 hari)",nilai:"2 Botol - SGD 119"},
    "1":{nama:"1 Botol (Percubaan)",asal:109,diskaun:40,inc:"1 botol (15 hari)",nilai:"1 Botol - SGD 69"}
  };
  function f(n){return "SGD "+n.toFixed(2);}
  function semua(sec){return [].slice.call(sec.querySelectorAll('.ladi-paragraph,.ladi-headline'));}
  function el(sec,txt){return semua(sec).filter(function(e){return e.textContent.trim()===txt;})[0]||null;}
  function mula(){
    var tajuk=semua(document).filter(function(e){return e.textContent.trim()==='Ringkasan pesanan';})[0];
    if(!tajuk) return;
    var sec=tajuk.closest('.ladi-section'); if(!sec||sec.dataset.btl) return; sec.dataset.btl=1;
    var R={pakej:el(sec,'3 Botol (Rawatan Penuh)'),asal:el(sec,'SGD 327.00'),disk:el(sec,'- SGD 188.00'),tot:el(sec,'SGD 139.00'),inc:semua(sec).filter(function(e){return e.textContent.replace(/\s+/g,' ').trim().indexOf('Termasuk:')===0;})[0]||null};
    var inp=sec.querySelector('input[name="pakej"]');
    if(inp){inp.readOnly=true;inp.style.fontWeight='700';inp.style.color='#0b3a24';inp.style.background='#eaf6e4';}
    var kad={};
    ['3','2','1'].forEach(function(n){
      var t=el(sec,n+' Botol'); if(!t) return;
      var g=t.closest('.ladi-element'); var r=g.getBoundingClientRect();
      /* kotak latar kad = elemen .ladi-box terbesar yang meliputi teks ini */
      var best=null; sec.querySelectorAll('.ladi-box').forEach(function(b){var e=b.closest('.ladi-element'),q=e.getBoundingClientRect();
        if(q.left<=r.left+2&&q.right>=r.right-2&&q.top<=r.top&&q.bottom>=r.bottom&&q.width<sec.getBoundingClientRect().width*0.5){if(!best||q.height<best.getBoundingClientRect().height)best=e;}});
      if(best) kad[n]=best;
    });
    var gaya=document.createElement('style');
    gaya.textContent='.btl-kad{cursor:pointer}.btl-kad .ladi-box{transition:box-shadow .2s,background .2s}.btl-kad.btl-on .ladi-box{box-shadow:0 0 0 3px #1f9d46,0 10px 22px -10px rgba(31,157,70,.6)!important;background:#effaec!important}.btl-tick{position:absolute;top:-10px;left:-10px;width:28px;height:28px;border-radius:50%;background:#1f9d46;color:#fff;font:700 17px/28px Quicksand,sans-serif;text-align:center;z-index:20;display:none;box-shadow:0 4px 10px rgba(0,0,0,.25)}.btl-on .btl-tick{display:block}';
    document.head.appendChild(gaya);
    function pilih(n){
      var p=PK[n]; if(!p) return;
      for(var k in kad){kad[k].classList.toggle('btl-on',k===n);}
      if(R.pakej)R.pakej.textContent=p.nama; if(R.asal)R.asal.textContent=f(p.asal);
      if(R.disk)R.disk.textContent='- '+f(p.diskaun); if(R.tot)R.tot.textContent=f(p.asal-p.diskaun);
      if(R.inc)R.inc.textContent='Termasuk: '+p.inc;
      if(inp){inp.value=p.nilai;inp.dispatchEvent(new Event('input',{bubbles:true}));inp.dispatchEvent(new Event('change',{bubbles:true}));}
    }
    /* klik di mana-mana dalam kawasan kad (kotak, gambar, teks) */
    sec.addEventListener('click',function(ev){
      for(var n in kad){var q=kad[n].getBoundingClientRect();if(ev.clientX>=q.left&&ev.clientX<=q.right&&ev.clientY>=q.top&&ev.clientY<=q.bottom){pilih(n);return;}}
    },true);
    for(var n in kad){var k=kad[n];k.classList.add('btl-kad');k.style.overflow='visible';var t=document.createElement('span');t.className='btl-tick';t.textContent='✓';k.appendChild(t);}
    pilih('3');
    /* butang 'Pilih N Botol' di bahagian harga -> pilih kad sama dalam borang */
    document.addEventListener('click',function(ev){
      var b=ev.target.closest&&ev.target.closest('.ladi-button'); if(!b) return;
      var m=b.textContent.match(/Pilih\s*([123])\s*Botol/i); if(m) setTimeout(function(){pilih(m[1]);},50);
    },true);
    var tel=sec.querySelector('input[name="phone"]');
    if(tel){tel.addEventListener('blur',function(){var d=tel.value.replace(/\D/g,'');if(d.indexOf('65')===0&&d.length===10)d=d.slice(2);if(d.length===8)tel.value='+65'+d;});}
    var pos=sec.querySelector('input[name="zipcode"]');
    if(pos){pos.setAttribute('inputmode','numeric');pos.addEventListener('input',function(){pos.value=pos.value.replace(/\D/g,'').slice(0,6);});}
  }
  mula(); window.addEventListener('load',mula); setTimeout(mula,1500); setTimeout(mula,3500);
})();
</script>
